<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>doc-ingestion-pipeline (dark)</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>body{margin:0;padding:1.5rem;background:#2d3142;}</style>
</head>
<body>
<svg viewBox="0 0 1000 880" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dokingest-title dokingest-desc">
      <title id="dokingest-title">Cairn doc ingestion pipeline</title>
      <desc id="dokingest-desc">Documents from fed files or repository scans pass through frontmatter parsing, classification, redaction, and identity assignment, then stage into a reviewable outbox manifest; only an explicit ingest flag executes the manifest into the knowledge store.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#2d3142"/>

      <!-- Arrows first -->
      <line x1="320" y1="96" x2="320" y2="128" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="320" y1="196" x2="320" y2="228" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="320" y1="296" x2="320" y2="328" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="320" y1="396" x2="320" y2="428" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="320" y1="496" x2="320" y2="516" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="376" y1="568" x2="556" y2="568" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="320" y1="616" x2="320" y2="648" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="320" y1="716" x2="320" y2="748" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="400" y="550" width="96" height="12" rx="2" fill="#2d3142"/>
      <text x="448" y="559" fill="#8e98ac" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO · DEFAULT</text>
      <rect x="332" y="626" width="88" height="12" rx="2" fill="#2d3142"/>
      <text x="376" y="635" fill="#8e98ac" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES · --ingest</text>

      <!-- Spine nodes -->
      <rect x="180" y="32" width="280" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="320" y="60" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Source adapters</text>
      <text x="320" y="78" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fed .md/.pdf/.docx · repo docs/ scan</text>

      <rect x="180" y="132" width="280" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="320" y="160" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Parse frontmatter</text>
      <text x="320" y="178" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">title · status · tags · body</text>

      <rect x="180" y="232" width="280" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="320" y="260" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Classify</text>
      <text x="320" y="278" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">decision/spec/workflow/rule · draft gate</text>

      <rect x="180" y="332" width="280" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="320" y="360" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Redact + identity</text>
      <text x="320" y="378" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">strip_private_data · collision-safe slug</text>

      <rect x="180" y="432" width="280" height="64" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1.2"/>
      <text x="320" y="460" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Stage outbox</text>
      <text x="320" y="478" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">OKF md + manifest.json · dry-run default</text>

      <polygon points="320,520 376,568 320,616 264,568" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="320" y="572" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">--ingest?</text>

      <rect x="180" y="652" width="280" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="320" y="680" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Execute manifest</text>
      <text x="320" y="698" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">add_document · embed · verify legs</text>

      <rect x="180" y="752" width="280" height="64" rx="20" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="320" y="778" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">In knowledge store</text>
      <text x="320" y="796" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">knowledge/&lt;type&gt;/&lt;slug&gt;.md</text>

      <!-- Side terminal -->
      <rect x="560" y="536" width="240" height="64" rx="20" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="680" y="562" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dry run ends</text>
      <text x="680" y="580" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">manifest only — review, then --ingest</text>

      <!-- Legend -->
      <line x1="32" y1="848" x2="968" y2="848" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
      <text x="32" y="872" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="116" y="860" width="20" height="16" rx="4" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="144" y="872" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace">stage</text>
      <rect x="212" y="860" width="24" height="16" rx="8" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="244" y="872" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace">terminal</text>
      <polygon points="336,868 348,860 360,868 348,876" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="368" y="872" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace">flag decision</text>
      <rect x="468" y="860" width="20" height="16" rx="4" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
      <text x="496" y="872" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace">reviewable staging</text>
    </svg>
</body>
</html>
