<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>indexing-pipeline (dark)</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>body{margin:0;padding:1.5rem;background:#2d3142;}</style>
</head>
<body>
<svg viewBox="0 0 1000 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="idxflow-title idxflow-desc">
      <title id="idxflow-title">Cairn indexing pipeline</title>
      <desc id="idxflow-desc">Top-down flow from workspace scan through tree-sitter parsing, row insertion, and tiered edge resolution, derived index building, and an atomic database swap; a dashed side path shows the incremental update shortcut.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#2d3142"/>

      <!-- Arrows first -->
      <line x1="420" y1="96" x2="420" y2="124" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="420" y1="192" x2="420" y2="220" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="420" y1="288" x2="420" y2="316" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="420" y1="384" x2="420" y2="412" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="420" y1="480" x2="420" y2="508" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="248" y1="360" x2="276" y2="360" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Arrow labels (masked, clear of strokes) -->
      <rect x="232" y="344" width="72" height="12" rx="2" fill="#2d3142"/>
      <text x="268" y="353" fill="#8e98ac" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GIT DIFF</text>

      <!-- Spine nodes -->
      <rect x="280" y="32" width="280" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="420" y="60" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Scan workspace</text>
      <text x="420" y="78" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">4-layer filter · SHA-256 · skip audit</text>

      <rect x="280" y="128" width="280" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="420" y="156" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Parse + enrich</text>
      <text x="420" y="174" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tree-sitter ×14 · routes · svc calls</text>

      <rect x="280" y="224" width="280" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="420" y="252" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Insert rows</text>
      <text x="420" y="270" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">files · symbols · edges · imports</text>

      <rect x="280" y="320" width="280" height="64" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1.2"/>
      <text x="420" y="348" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Resolve edges</text>
      <text x="420" y="366" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">5 tiers → exact / ambiguous / unres.</text>

      <rect x="280" y="416" width="280" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="420" y="444" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Build derived indexes</text>
      <text x="420" y="462" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dataflow · transitive closure</text>

      <rect x="280" y="512" width="280" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="420" y="540" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Atomic swap</text>
      <text x="420" y="558" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">backup_to → swap_db_file (.kg)</text>

      <!-- Side nodes -->

      <rect x="32" y="324" width="216" height="72" rx="6" fill="rgba(245,245,245,0.02)" stroke="rgba(245,245,245,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="140" y="348" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Incremental update</text>
      <text x="140" y="366" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">git diff → reindex paths</text>
      <text x="140" y="382" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">repair incoming edges</text>

      <!-- Legend -->
      <line x1="32" y1="608" x2="968" y2="608" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
      <text x="32" y="632" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="116" y="622" width="20" height="14" rx="3" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="144" y="632" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace">build stage</text>
      <rect x="248" y="622" width="20" height="14" rx="3" fill="rgba(245,245,245,0.02)" stroke="rgba(245,245,245,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="276" y="632" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace">incremental path</text>
      <rect x="412" y="622" width="20" height="14" rx="3" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
      <text x="440" y="632" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace">resolution (the differentiator)</text>
    </svg>
</body>
</html>
