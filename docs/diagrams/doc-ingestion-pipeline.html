<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cairn Doc Ingestion Pipeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Cairn</p>
    <h1>Doc Ingestion Pipeline</h1>

    <svg viewBox="0 0 1000 880" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dokingest-title dokingest-desc">
      <title id="dokingest-title">Cairn doc ingestion pipeline</title>
      <desc id="dokingest-desc">Documents from fed files or repository scans pass through frontmatter parsing, classification, redaction, and identity assignment, then stage into a reviewable outbox manifest; only an explicit ingest flag executes the manifest into the knowledge store.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows first -->
      <line x1="320" y1="96" x2="320" y2="128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="320" y1="196" x2="320" y2="228" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="320" y1="296" x2="320" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="320" y1="396" x2="320" y2="428" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="320" y1="496" x2="320" y2="516" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="376" y1="568" x2="556" y2="568" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="320" y1="616" x2="320" y2="648" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="320" y1="716" x2="320" y2="748" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="400" y="550" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="448" y="559" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO · DEFAULT</text>
      <rect x="332" y="626" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="376" y="635" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES · --ingest</text>

      <!-- Spine nodes -->
      <rect x="180" y="32" width="280" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Source adapters</text>
      <text x="320" y="78" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fed .md/.pdf/.docx · repo docs/ scan</text>

      <rect x="180" y="132" width="280" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="160" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Parse frontmatter</text>
      <text x="320" y="178" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">title · status · tags · body</text>

      <rect x="180" y="232" width="280" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="260" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Classify</text>
      <text x="320" y="278" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">decision/spec/workflow/rule · draft gate</text>

      <rect x="180" y="332" width="280" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="360" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Redact + identity</text>
      <text x="320" y="378" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">strip_private_data · collision-safe slug</text>

      <rect x="180" y="432" width="280" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="320" y="460" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Stage outbox</text>
      <text x="320" y="478" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">OKF md + manifest.json · dry-run default</text>

      <polygon points="320,520 376,568 320,616 264,568" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="572" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">--ingest?</text>

      <rect x="180" y="652" width="280" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="680" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Execute manifest</text>
      <text x="320" y="698" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">add_document · embed · verify legs</text>

      <rect x="180" y="752" width="280" height="64" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="778" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">In knowledge store</text>
      <text x="320" y="796" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">knowledge/&lt;type&gt;/&lt;slug&gt;.md</text>

      <!-- Side terminal -->
      <rect x="560" y="536" width="240" height="64" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="680" y="562" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dry run ends</text>
      <text x="680" y="580" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">manifest only — review, then --ingest</text>

      <!-- Legend -->
      <line x1="32" y1="848" x2="968" y2="848" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="872" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="116" y="860" width="20" height="16" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="144" y="872" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">stage</text>
      <rect x="212" y="860" width="24" height="16" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="244" y="872" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">terminal</text>
      <polygon points="336,868 348,860 360,868 348,876" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="368" y="872" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">flag decision</text>
      <rect x="468" y="860" width="20" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="496" y="872" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">reviewable staging</text>
    </svg>
  </div>
</body>
</html>
