<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-source document ingestion pipeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Cairn Knowledge Ingestion</p>
    <h1>Multi-source document ingestion pipeline</h1>

    <svg viewBox="0 0 1160 412" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="doc-ingestion-pipeline-title doc-ingestion-pipeline-desc">
      <title id="doc-ingestion-pipeline-title">Multi-source document ingestion pipeline</title>
      <desc id="doc-ingestion-pipeline-desc">Architecture diagram showing three document sources — repository scans, fed markdown files, and fed PDF or docx files — fanning into a normalize-and-classify stage, an OKF outbox with manifest, a human checkpoint gate, then the cairn knowledge add, embed, and verify steps inside the knowledge store.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <!-- Background -->
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zones (drawn before arrows and nodes) -->
      <g>
        <rect x="40" y="64" width="144" height="288" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="66" y="68" width="92" height="12" rx="2" fill="#f5f5f5"/>
        <text x="112" y="77" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SOURCES</text>

        <rect x="204" y="152" width="312" height="128" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="276" y="156" width="168" height="12" rx="2" fill="#f5f5f5"/>
        <text x="360" y="165" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">INGEST SCRIPT</text>

        <rect x="692" y="152" width="432" height="128" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="852" y="156" width="112" height="12" rx="2" fill="#f5f5f5"/>
        <text x="908" y="165" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CAIRN STORE</text>
      </g>

      <!-- Connectors (drawn before nodes) -->
      <!-- S1 Repo scan -> Normalize & classify (right + down elbow) -->
      <path d="M 172,132 H 186 Q 194,132 194,140 V 192 Q 194,200 202,200 H 216" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- S2 Markdown files -> Normalize & classify (same y, straight) -->
      <line x1="172" y1="216" x2="216" y2="216" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- S3 PDF/docx -> Normalize & classify (right + up elbow) -->
      <path d="M 172,300 H 186 Q 194,300 194,292 V 240 Q 194,232 202,232 H 216" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- Normalize & classify -> OKF outbox -->
      <line x1="356" y1="216" x2="380" y2="216" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- OKF outbox -> Checkpoint (focal path, accent) -->
      <line x1="500" y1="216" x2="524" y2="216" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <!-- Checkpoint -> knowledge add (trigger, dashed) with masked label -->
      <rect x="652" y="198" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="674" y="206" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GO-AHEAD</text>
      <line x1="644" y1="216" x2="704" y2="216" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- knowledge add -> knowledge embed -->
      <line x1="824" y1="216" x2="848" y2="216" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- knowledge embed -> Verify -->
      <line x1="968" y1="216" x2="992" y2="216" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Nodes -->
      <!-- S1: Repo scan -->
      <g>
        <rect x="52" y="100" width="120" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="60" y="106" width="24" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
        <text x="72" y="115" fill="rgba(122,131,153,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REPO</text>
        <text x="112" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Repo scan</text>
        <text x="112" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">walk repo docs/ dirs</text>
      </g>
      <!-- S2: Markdown files -->
      <g>
        <rect x="52" y="184" width="120" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="60" y="190" width="16" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
        <text x="68" y="199" fill="rgba(122,131,153,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MD</text>
        <text x="112" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Markdown files</text>
        <text x="112" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fed .md · parse fm</text>
      </g>
      <!-- S3: PDF / docx -->
      <g>
        <rect x="52" y="268" width="120" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="60" y="274" width="20" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
        <text x="70" y="283" fill="rgba(122,131,153,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PDF</text>
        <text x="112" y="304" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PDF · docx</text>
        <text x="112" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fed · convert to md</text>
      </g>
      <!-- N1: Normalize & classify -->
      <g>
        <rect x="216" y="184" width="140" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="224" y="190" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="240" y="199" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SCRIPT</text>
        <text x="286" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Normalize &amp; classify</text>
        <text x="286" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">convert → md · doc_type</text>
      </g>
      <!-- N2: OKF outbox — FOCAL -->
      <g>
        <rect x="380" y="184" width="120" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="388" y="190" width="40" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
        <text x="408" y="199" fill="rgba(235,108,54,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STAGING</text>
        <text x="440" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">OKF outbox</text>
        <text x="440" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">manifest + OKF md</text>
      </g>
      <!-- N3: Checkpoint — governance concern -->
      <g>
        <rect x="524" y="184" width="120" height="64" rx="6" fill="rgba(184,84,80,0.06)" stroke="rgba(184,84,80,0.35)" stroke-width="1"/>
        <rect x="532" y="190" width="28" height="12" rx="2" fill="transparent" stroke="rgba(184,84,80,0.40)" stroke-width="0.8"/>
        <text x="546" y="199" fill="rgba(184,84,80,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HUMAN</text>
        <text x="584" y="220" fill="#b85450" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Checkpoint</text>
        <text x="584" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dry-run go-ahead</text>
      </g>
      <!-- N4: knowledge add -->
      <g>
        <rect x="704" y="184" width="120" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="712" y="190" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="726" y="199" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CAIRN</text>
        <text x="764" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">knowledge add</text>
        <text x="764" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">redact · write OKF</text>
      </g>
      <!-- N5: knowledge embed -->
      <g>
        <rect x="848" y="184" width="120" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="856" y="190" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="870" y="199" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CAIRN</text>
        <text x="908" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">knowledge embed</text>
        <text x="908" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">vector index</text>
      </g>
      <!-- N6: Verify — quality concern -->
      <g>
        <rect x="992" y="184" width="120" height="64" rx="6" fill="rgba(90,125,154,0.06)" stroke="rgba(90,125,154,0.35)" stroke-width="1"/>
        <rect x="1000" y="190" width="28" height="12" rx="2" fill="transparent" stroke="rgba(90,125,154,0.40)" stroke-width="0.8"/>
        <text x="1014" y="199" fill="rgba(90,125,154,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CAIRN</text>
        <text x="1052" y="220" fill="#5a7d9a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Verify</text>
        <text x="1052" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">list · validate</text>
      </g>

      <!-- Legend — horizontal bottom strip -->
      <line x1="40" y1="368" x2="1124" y2="368" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <g font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">
        <text x="40" y="391" letter-spacing="0.14em">LEGEND</text>

        <rect x="120" y="382" width="12" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="0.8"/>
        <text x="140" y="391">source</text>

        <rect x="210" y="382" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
        <text x="230" y="391">pipeline step</text>

        <rect x="330" y="382" width="12" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/>
        <text x="350" y="391">staged artifact · focal</text>

        <rect x="510" y="382" width="12" height="12" rx="2" fill="rgba(184,84,80,0.06)" stroke="rgba(184,84,80,0.35)" stroke-width="0.8"/>
        <text x="530" y="391">governance gate</text>

        <rect x="650" y="382" width="12" height="12" rx="2" fill="rgba(90,125,154,0.06)" stroke="rgba(90,125,154,0.35)" stroke-width="0.8"/>
        <text x="670" y="391">verification</text>

        <line x1="770" y1="388" x2="798" y2="388" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <text x="806" y="391">hand-off</text>

        <line x1="880" y1="388" x2="908" y2="388" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <text x="916" y="391">focal path</text>

        <line x1="1000" y1="388" x2="1028" y2="388" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="1036" y="391">go-ahead trigger</text>
      </g>
    </svg>
  </div>
</body>
</html>
