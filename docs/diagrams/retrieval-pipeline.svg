<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 816" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="retrieval-title retrieval-desc">
      <title id="retrieval-title">Cairn retrieval pipeline</title>
      <desc id="retrieval-desc">A query fans out into a dense vector leg and a sparse BM25 leg which recombine through RRF fusion; a confidence gate either returns the fused order directly or escalates to a CrossEncoder rerank before ranked results.</desc>
      <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows first -->
      <path d="M 440,96 V 124 Q 440,132 432,132 H 328 Q 320,132 320,140 V 156" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 560,96 V 124 Q 560,132 568,132 H 672 Q 680,132 680,140 V 156" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 320,232 V 264 Q 320,272 328,272 H 432 Q 440,272 440,280 V 292" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 680,232 V 264 Q 680,272 672,272 H 568 Q 560,272 560,280 V 292" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="368" x2="500" y2="400" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="556" y1="448" x2="676" y2="448" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="492" x2="500" y2="540" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 800,480 V 704 Q 800,712 792,712 H 624" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="500" y1="616" x2="500" y2="676" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="568" y="426" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="620" y="435" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES · CONFIDENT</text>
      <rect x="510" y="508" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="524" y="517" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <!-- Nodes -->
      <rect x="380" y="32" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Query</text>
      <text x="500" y="78" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">identifier enrich · IDF trim</text>

      <rect x="200" y="160" width="240" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="190" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dense leg</text>
      <text x="320" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">bge-m3 embed → vec0 ANN</text>
      <text x="320" y="222" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cosine fallback ≥ 0.3</text>

      <rect x="560" y="160" width="240" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="680" y="190" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sparse leg</text>
      <text x="680" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">FTS5 bm25 over symbols_fts</text>
      <text x="680" y="222" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">prefix phrases · LIKE fallback</text>

      <rect x="380" y="296" width="240" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="500" y="326" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">RRF fusion</text>
      <text x="500" y="344" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">k=60 · always on · provenance</text>

      <polygon points="500,404 556,448 500,492 444,448" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="446" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">confident?</text>
      <text x="500" y="462" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">margin ≥ 0.45 + exact hit</text>

      <rect x="680" y="416" width="240" height="64" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="800" y="442" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Return fused order</text>
      <text x="800" y="460" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">skip rerank · event logged</text>

      <rect x="380" y="544" width="240" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="574" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CrossEncoder rerank</text>
      <text x="500" y="592" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">bge-reranker-base · 512 tok</text>
      <text x="500" y="606" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pool 5×limit · hybrid fallback</text>

      <rect x="380" y="680" width="240" height="64" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="706" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ranked results</text>
      <text x="500" y="724" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">provenance per row</text>

      <!-- Legend -->
      <line x1="32" y1="776" x2="968" y2="776" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="800" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="116" y="788" width="20" height="16" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="144" y="800" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">stage</text>
      <rect x="212" y="788" width="24" height="16" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="244" y="800" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">terminal</text>
      <polygon points="336,796 348,788 360,796 348,804" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="368" y="800" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">confidence gate</text>
      <rect x="476" y="788" width="20" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="504" y="800" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">always-on fusion</text>
      <line x1="636" y1="796" x2="668" y2="796" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="676" y="800" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">no-rerank return</text>
    </svg>
