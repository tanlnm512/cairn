<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="t">
  <title id="t">Cairn logo annotated — five stones stand for five layers</title>
  <g transform="translate(10 0) scale(0.62)">
    <circle cx="256" cy="245" r="152" fill="none" stroke="#b45309" stroke-width="10"/>
    <ellipse cx="256" cy="420" rx="118" ry="13" fill="#b45309" opacity="0.14"/>
    <rect x="166" y="352" width="180" height="60" rx="30" fill="#7c2d12"/>
    <rect x="182" y="302" width="140" height="52" rx="26" fill="#92400e"/>
    <rect x="201" y="258" width="110" height="46" rx="23" fill="#b45309"/>
    <rect x="214" y="220" width="84" height="40" rx="20" fill="#d97706"/>
    <ellipse cx="256" cy="199" rx="30" ry="19" fill="#f59e0b"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" fill="#23201b">
    <g stroke="#b45309" stroke-width="1.5" opacity="0.55">
      <line x1="224" y1="237" x2="368" y2="237"/>
      <line x1="210" y1="203" x2="368" y2="203"/>
      <line x1="203" y1="174" x2="368" y2="174"/>
      <line x1="195" y1="149" x2="368" y2="149"/>
      <line x1="187" y1="123" x2="368" y2="123"/>
    </g>
    <text x="380" y="243"><tspan font-weight="700" fill="#7c2d12">1 · Graph</tspan> — the codebase knowledge graph</text>
    <text x="380" y="209"><tspan font-weight="700" fill="#92400e">2 · Knowledge base</tspan> — OKF concept store</text>
    <text x="380" y="180"><tspan font-weight="700" fill="#b45309">3 · Compass</tspan> — cross-layer navigation</text>
    <text x="380" y="155"><tspan font-weight="700" fill="#d97706">4 · Memory</tspan> — tribal decisions &amp; patterns</text>
    <text x="380" y="129"><tspan font-weight="700" fill="#f59e0b">5 · Knowledge</tspan> — generated wiki</text>
    <text x="380" y="330" font-size="16" fill="#6f675a">The ring is the verification contract:</text>
    <text x="380" y="354" font-size="16" fill="#6f675a">every layer's output is checked against</text>
    <text x="380" y="378" font-size="16" fill="#6f675a">the store before an agent may trust it.</text>
  </g>
</svg>
