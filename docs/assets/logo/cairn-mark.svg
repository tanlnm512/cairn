<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">Cairn — five stones, five layers</title>
  <!-- verification ring -->
  <circle cx="256" cy="245" r="152" fill="none" stroke="#b45309" stroke-width="10"/>
  <!-- ground shadow -->
  <ellipse cx="256" cy="420" rx="118" ry="13" fill="#b45309" opacity="0.14"/>
  <!-- five stones, one layer each: graph (base) → knowledge base → compass → memory → knowledge -->
