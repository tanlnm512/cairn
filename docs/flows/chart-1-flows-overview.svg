      <title id="cairn-flows-title">cairn business flows F1–F9</title>
      <desc id="cairn-flows-desc">Architecture map of the cairn workspace: three serving surfaces (MCP daemon, CLI, dashboard) dispatch into a shared cairn-query read core and a cairn-build write path, over the .kg SQLite store, the .knowledge bundle, and the cross-repo workspaces registry, with the nine business flows tagged F1 to F9.</desc>
