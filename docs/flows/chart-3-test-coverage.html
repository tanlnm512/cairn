<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cairn test check — test files per business flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Bar · Test check</p>
    <h1>Test files per business flow</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cairn-testcov-title cairn-testcov-desc">
      <title id="cairn-testcov-title">Test files per cairn business flow</title>
      <desc id="cairn-testcov-desc">Column chart of integration test files per cairn business flow: build pipeline thirteen, graph query nine, knowledge layer six, semantic search five, federation two, MCP daemon two, dashboard one, with federation flagged because its federated_search store walk has no test.</desc>
      <defs></defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- gridlines + value ticks (24px per unit, 0 at y=420, domain 0..14) -->
      <line x1="80" y1="252" x2="960" y2="252" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="84" x2="960" y2="84" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="420" x2="960" y2="420" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <line x1="80" y1="40" x2="80" y2="420" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>

      <text x="72" y="423" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0</text>
      <text x="72" y="255" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">7</text>
      <text x="72" y="87" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">14</text>
      <text transform="rotate(-90 24 230)" x="24" y="230" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">TEST FILES</text>

      <!-- bars (centers 156, 276, 396, 516, 636, 756, 876 · w=72) -->
      <rect x="120" y="108" width="72" height="312" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="156" y="100" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">13</text>

      <rect x="240" y="204" width="72" height="216" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="276" y="196" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">9</text>

      <rect x="360" y="276" width="72" height="144" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="396" y="268" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">6</text>

      <rect x="480" y="300" width="72" height="120" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="516" y="292" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">5</text>

      <!-- F7 focal -->
      <rect x="600" y="372" width="72" height="48" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1"/>
      <text x="636" y="364" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">2</text>
      <text x="636" y="330" fill="rgba(45,49,66,0.75)" font-size="14" font-family="'Instrument Serif', serif" font-style="italic" text-anchor="middle">federated_search</text>
      <text x="636" y="348" fill="rgba(45,49,66,0.75)" font-size="14" font-family="'Instrument Serif', serif" font-style="italic" text-anchor="middle">is untested</text>

      <rect x="720" y="372" width="72" height="48" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="756" y="364" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">2</text>

      <rect x="840" y="396" width="72" height="24" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="876" y="388" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>

      <!-- category labels -->
      <text x="156" y="440" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">F1 build</text>
      <text x="276" y="440" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">F2 query</text>
      <text x="396" y="440" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">F4–F6 know.</text>
      <text x="516" y="440" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">F3 semantic</text>
      <text x="636" y="440" fill="#eb6c36" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">F7 fed.</text>
      <text x="756" y="440" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">F8 daemon</text>
      <text x="876" y="440" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">F9 dash.</text>

      <!-- legend -->
      <line x1="80" y1="462" x2="960" y2="462" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="80" y="482" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="150" y="473" width="14" height="10" rx="2" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="172" y="482" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">matching test files</text>
      <rect x="310" y="473" width="14" height="10" rx="2" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1"/>
      <text x="332" y="482" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">flagged flow</text>
      <text x="960" y="482" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">generated by `cargo xtask flow-coverage` · F4–F6 merged (share km_golden.rs)</text>
    </svg>
  </div>
</body>
</html>
