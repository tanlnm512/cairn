<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cairn continue-develop priorities — impact × effort</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Quadrant · Continue-develop priorities</p>
    <h1>Where to pick development back up</h1>

    <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cairn-prio-title cairn-prio-desc">
      <title id="cairn-prio-title">cairn follow-up priorities</title>
      <desc id="cairn-prio-desc">Impact-versus-effort quadrant with no open follow-up actions: every item from the business-flow audit has landed or been resolved.</desc>
      <defs>
        <marker id="prio-axis" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2d3142"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- axes -->
      <line x1="500" y1="480" x2="500" y2="64" stroke="#2d3142" stroke-width="1.2" marker-end="url(#prio-axis)"/>
      <line x1="60" y1="280" x2="936" y2="280" stroke="#2d3142" stroke-width="1.2" marker-end="url(#prio-axis)"/>

      <text x="500" y="48" fill="#2d3142" font-size="9" font-weight="400" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.18em">IMPACT</text>
      <text x="952" y="280" fill="#2d3142" font-size="9" font-weight="400" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.18em" dominant-baseline="middle">EFFORT</text>

      <!-- corner tags -->
      <text x="76" y="84" fill="rgba(45,49,66,0.40)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">DO FIRST</text>
      <text x="924" y="84" fill="rgba(45,49,66,0.40)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.18em">PLAN</text>
      <text x="76" y="508" fill="rgba(45,49,66,0.40)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">FILL-IN</text>
      <text x="924" y="508" fill="rgba(45,49,66,0.40)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.18em">RECONSIDER</text>

      <!-- items -->


      <!-- legend -->
      <line x1="60" y1="524" x2="940" y2="524" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="60" y="542" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <circle cx="130" cy="539" r="4" fill="#2d3142"/>
      <text x="142" y="542" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">follow-up</text>
      <circle cx="230" cy="539" r="4" fill="#eb6c36" stroke="#2d3142" stroke-width="1"/>
      <text x="242" y="542" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">do first</text>
      <text x="940" y="542" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">source: docs/flows/business-flows.md</text>
    </svg>
  </div>
</body>
</html>
