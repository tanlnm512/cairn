      <rect x="600" y="300" width="72" height="120" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="636" y="292" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">5</text>

      <rect x="720" y="348" width="72" height="72" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="756" y="340" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">3</text>

      <rect x="840" y="396" width="72" height="24" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="876" y="388" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>

      <!-- category labels -->
      <text x="156" y="440" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">F1 build</text>
      <text x="276" y="440" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">F2 query</text>
      <text x="396" y="440" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">F4–F6 know.</text>
      <text x="516" y="440" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">F3 semantic</text>
      <text x="636" y="440" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">F8 daemon</text>
      <text x="756" y="440" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">F7 fed.</text>
      <text x="876" y="440" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">F9 dash.</text>

      <!-- legend -->
      <line x1="80" y1="462" x2="960" y2="462" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="80" y="482" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="150" y="473" width="14" height="10" rx="2" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="172" y="482" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">matching test files</text>
      <text x="960" y="482" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">generated by `cargo xtask flow-coverage` · F4–F6 merged (share km_golden.rs)</text>
    </svg>
