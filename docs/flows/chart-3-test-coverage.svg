<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cairn-testcov-title cairn-testcov-desc">
      <title id="cairn-testcov-title">Test files per cairn business flow</title>
      <desc id="cairn-testcov-desc">Column chart of integration test files per cairn business flow: build pipeline thirteen, knowledge layer eight, graph query ten, semantic search and MCP daemon five each, federation three, dashboard one.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style></defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- gridlines + value ticks (24px per unit, 0 at y=420, domain 0..14) -->
      <line x1="80" y1="252" x2="960" y2="252" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="84" x2="960" y2="84" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="420" x2="960" y2="420" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <line x1="80" y1="40" x2="80" y2="420" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>

      <text x="72" y="423" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0</text>
      <text x="72" y="255" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">7</text>
      <text x="72" y="87" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">14</text>
      <text transform="rotate(-90 24 230)" x="24" y="230" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">TEST FILES</text>

      <!-- bars (centers 156, 276, 396, 516, 636, 756, 876 · w=72) -->
      <rect x="120" y="108" width="72" height="312" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="156" y="100" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">13</text>

      <rect x="240" y="180" width="72" height="240" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="276" y="172" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">10</text>

      <rect x="360" y="228" width="72" height="192" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="396" y="220" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">8</text>

      <rect x="480" y="300" width="72" height="120" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
