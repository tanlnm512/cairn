name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Security: supply-chain + code scanning -----------------------------
  # pip-audit is a HARD gate: a known-vulnerable dependency blocks the PR.
  # bandit is ADVISORY (continue-on-error): it surfaces NEW security
  # regressions (eval/exec/pickle/shell/weak-crypto) without churning on the
  # codebase's known-benign findings. B608 is skipped via -s because every SQL
  # query here is parameterized (f-strings interpolate only the `?,?,?`
  # placeholder list; values pass separately to execute()) -- the 26 B608 hits
  # are false positives. The B324 hashlib findings were silenced at the call
  # sites with usedforsecurity=False (content-addressing IDs, not crypto); the
  # only remaining hits are 2 B310 urllib fetches (timeout-bounded, to known
  # URLs) -- benign.
  security:
    name: Security (pip-audit + bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (with dev + otlp extras)
        run: |
          python -m pip install --upgrade pip
          # [otlp] rides the audit too: it's a user-facing install surface
          # (pip install cairn-intel[otlp]) -- a CVE there must fail this gate.
          pip install -e ".[dev,otlp]"
      - name: pip-audit (hard gate -- known-vulnerable deps fail here)
        run: pip-audit
      - name: bandit (advisory)
        continue-on-error: true
        run: bandit -r src -ii -ll -s B608

  # --- Type checking: ADVISORY at adoption --------------------------------
  # mypy reports ~60 errors at default settings today (--ignore-missing-imports
  # because tree-sitter & friends ship no stubs). Same philosophy as the ruff
  # gate: ship advisory so NEW type regressions are visible without blocking
  # CI, then drive the count down and remove `continue-on-error` to make it a
  # hard gate.
  typecheck:
    name: Type check (mypy, advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # continue-on-error at the STEP level (not job) -- the standard advisory
      # pattern, same as bandit above: the job reports SUCCESS (green) so it
      # doesn't block branch protection, while still printing the ~57 known
      # errors in the log for visibility. (Job-level continue-on-error leaves
      # the check red in branch protection.) Remove this line to promote mypy
      # to a hard gate once the error count is driven down.
      - name: mypy
        continue-on-error: true
        run: mypy --ignore-missing-imports src

  # --- Conventional Commit PR-title gate (hard) ---------------------------
  # Mirrors the commitizen convention that `cz bump` derives the SemVer bump
  # from. Fails the PR if the title isn't `type(optional-scope): subject`.
  pr-title:
    name: PR title (conventional commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Types match commitizen's defaults + the ones in this repo's history.
          types: |
            feat
            fix
            chore
            docs
            ci
            refactor
            perf
            test
            build
            style
            revert
          requireScope: false

  # --- pre-commit: server-side enforcement of all Layer-0 gates ------------
  # Closes the gap where a dev who skipped `pre-commit install` could bypass
  # local gates. This is the single server-side home for ALL Layer-0 checks --
  # ruff (F-only), gitleaks (secrets), and the yaml/toml/large-file/debug
  # checks all live in .pre-commit-config.yaml and are binding only because
  # this job runs them. (The old standalone `lint` job was removed as
  # redundant: it ran the same `ruff check` this job runs.)
  pre-commit:
    name: pre-commit (all local gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Cache pre-commit hook envs
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit
        run: pip install "pre-commit>=4.0"
      - name: Run all hooks
        run: pre-commit run --all-files

  # --- Dependency review for PRs (supply-chain, complements pip-audit) -----
  # pip-audit scans the fully-resolved environment; this checks the *delta* a
  # PR introduces (new/changed deps) against the GitHub Advisory DB + licenses.
  dependency-review:
    name: Dependency review (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/dependency-review-action@v4

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: pre-commit
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares >=3.10; cover the supported CPython range.
        # 3.14 is declared in classifiers but very new -- wheel gaps for
        # tree-sitter/sqlite-vec would fail loudly here, not silently pass.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate skill eval specs
        run: python scripts/run_skill_evals.py

      - name: Run core smoke subset
        run: pytest -m core -q

      - name: Run full test suite
        run: pytest -q --junitxml=test-results.xml --cov=cairn --cov-report=term --cov-report=xml

      - name: Publish test summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          import os
          path = "test-results.xml"
          if not os.path.exists(path):
              print("_(no test results — suite did not run)_")
          else:
              # junit XML: <testsuites><testsuite tests=... failures=... .../>
              # stats live on the <testsuite> child, not the <testsuites> root.
              root = ET.parse(path).getroot()
              suite = root if root.tag == "testsuite" else root.find("testsuite")
              if suite is None:
                  print("_(malformed test results)_")
              else:
                  n, fail, err, skip = (
                      suite.get(k, "0") for k in ("tests", "failures", "errors", "skipped")
                  )
                  ok = int(fail) == 0 and int(err) == 0
                  print(f"## Test results (Python ${{ matrix.python-version }})")
                  print()
                  print(f"{'✅' if ok else '❌'} **{n}** tests | "
                        f"✗ {fail} failures | "
                        f"⚠ {err} errors | "
                        f"⊘ {skip} skipped")
          EOF

      - name: Coverage summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          try:
              root = ET.parse("coverage.xml").getroot()
              rate = float(root.get("line-rate", "0")) * 100
              print(f"## Coverage (Python ${{ matrix.python-version }})")
              print()
              print(f"**{rate:.1f}%** line coverage")
          except Exception:
              print("_(coverage report unavailable)_")
          EOF

  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify the wheel imports
        run: |
          python -m pip install --upgrade pip
          pip install dist/*.whl
          python -c "import cairn; print('ok')"

      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  # --- Bench: advisory perf baseline comparison (T18) ---------------------
  # Runs `cairn bench` on a fixed deterministic synthetic corpus (seeded
  # generator + dep-free hash embed backend) and uploads the JSON result as
  # a workflow artifact. On PRs the result is compared against a rolling
  # baseline (an actions/cache entry refreshed by default-branch runs) and
  # posted as an ADVISORY PR comment; main pushes refresh the baseline.
  # Every bench step is continue-on-error: a timing regression -- or a noisy
  # shared runner -- can never redden CI. "Advisory first, gate later if
  # stable" (observability-telemetry plan, Phase 2).
  bench:
    name: Bench (advisory baseline comparison)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # post the advisory comparison comment
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # Rolling baseline. The run-id-unique key always misses, so the post-job
      # save always stores THIS run's result; restore-keys prefix restores the
      # most recent entry -- on PRs cache scoping falls back to the latest
      # default-branch baseline (and, when present, this PR's own earlier
      # runs, which is an equally fair comparison point).
      - name: Restore rolling bench baseline
        uses: actions/cache@v4
        with:
          path: bench-baseline.json
          key: bench-baseline-v1-${{ github.run_id }}
          restore-keys: bench-baseline-v1-

      - name: Run bench (fixed corpus, hash backend)
        continue-on-error: true
        run: |
          cairn bench --suite perf --n-files 60 --complexity medium \
            --embed-backend hash --repeats 3 \
            --json --save bench-current.json

      # Compare BEFORE the baseline payload is refreshed below (the compare
      # reads the restored baseline; the copy then updates it to this run's
      # result for the post-job cache save).
      - name: Compare vs baseline (advisory summary)
        if: always()
        continue-on-error: true
        run: python .github/scripts/bench_compare.py

      - name: Refresh baseline payload for cache save
        if: always()
        run: |
          if [ -f bench-current.json ]; then
            cp bench-current.json bench-baseline.json
          fi

      - name: Upload bench result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bench-result
          path: bench-current.json

      - name: Post advisory PR comment
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('bench-comment.md')) {
              core.info('no bench-comment.md; skipping');
              return;
            }
            const body = fs.readFileSync('bench-comment.md', 'utf8');
            const marker = '<!-- cairn-bench-advisory -->';
            const issue_number = context.issue.number;
            if (!issue_number) {
              core.info('no PR number in context; skipping');
              return;
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
            });
            const existing = comments.find(
              (c) => c.body && c.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }
