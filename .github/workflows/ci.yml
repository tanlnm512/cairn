name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Merge queue: once the queue is enabled on main's branch protection, the
  # full matrix below gates the queued merge itself (same triggers as push).
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Conventional Commit PR-title gate (hard) ---------------------------
  # Mirrors the commitizen convention that `cz bump` derives the SemVer bump
  # from. Fails the PR if the title isn't `type(optional-scope): subject`.
  pr-title:
    name: PR title (conventional commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Types match commitizen's defaults + the ones in this repo's history.
          types: |
            feat
            fix
            chore
            docs
            ci
            refactor
            perf
            test
            build
            style
            revert
          requireScope: false

  # --- pre-commit: server-side enforcement of all Layer-0 gates ------------
  # Closes the gap where a dev who skipped `prek install` could bypass
  # local gates. This is the single server-side home for ALL Layer-0 checks --
  # gitleaks (secrets), the yaml/toml/large-file checks, and the cargo hooks
  # all live in .pre-commit-config.yaml and are binding only because this job
  # runs them.
  pre-commit:
    name: pre-commit (all local gates)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREK_VERSION: "0.5.7"
    steps:
      - uses: actions/checkout@v5
      - name: Cache prek hook envs
        uses: actions/cache@v4
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # The comment-style hook runs `cargo xtask`, so every leg needs the toolchain.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> rust/target"
      - name: Install prek
        run: curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/j178/prek/releases/download/v${PREK_VERSION}/prek-installer.sh" | sh
      - name: Run all hooks
        # PR legs skip the two cargo hooks (~5 of the job's 6 minutes): Rust
        # CI runs both on every PR already. Main and the merge queue run all.
        run: prek run --all-files
        env:
          SKIP: ${{ github.event_name == 'pull_request' && 'cargo-fmt,cargo-clippy' || '' }}

  # --- Quality ratchet: audit-debt + comment-style stop-growth gates ------
  # Human modes keep the maintainer surface green; the JSON steps pin the
  # machine-readable contract report and tooling consume. The doc and
  # skill-eval gates ride the same leg.
  quality-ratchet:
    name: Quality ratchet (audit debt + comment style)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> rust/target"
      - name: Audit status (human gate)
        run: make audit-status
      - name: Comment style (human gate)
        run: make comment-style
      - name: Parse quality-gate JSON outputs
        run: |
          cargo xtask audit-status --json > audit-status.json
          cargo xtask comment-style --json > comment-style.json
          jq -e '
            (["P0", "P1", "P2", "P3"] - (.totals | keys) == [])
            and all(.totals[]; (keys == ["fixed", "remaining", "total"])
              and .remaining >= 0 and .remaining <= .total)
            and .remaining == ([.totals[].remaining] | add)
          ' audit-status.json
          jq -e '
            .ok == true and (.remaining | type) == "number"
            and .new == [] and .stale == []
          ' comment-style.json
      - name: Doc links resolve
        run: cargo xtask check-doc-links
      - name: Conformance table matches the fixtures
        run: cargo xtask conformance-table --check
      - name: SCIP fixture matches its generator
        run: cargo xtask scip-fixture --check
      - name: Validate skill eval specs
        run: cargo xtask skill-evals

  # --- Dependency review for PRs (supply-chain, complements cargo-deny) ----
  # cargo-deny (rust.yml) audits the full lockfile; this checks the *delta* a
  # PR introduces (new/changed deps) against the GitHub Advisory DB + licenses.
  dependency-review:
    name: Dependency review (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/dependency-review-action@v4

  # Packaging canary, MAIN PUSHES ONLY: verifies `maturin build` + `maturin sdist`
  # (bin wheel + sdist) stays green on every merge so packaging
  # breakage surfaces between releases, never at tag time (release.yml builds
  # the real multi-platform wheels there). PRs skip it deliberately -- the
  # engine compile buys no signal rust.yml's legs don't already give, and the
  # canary still runs on the merge commit itself.
  build:
    name: Build wheel + sdist
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: pre-commit
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.1.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> rust/target"

      - name: Build distributions
        run: |
          uvx maturin build --release --out dist
          uvx maturin sdist --out dist

      # The installed-product smoke proves the wheel is the engine binary
      # (no Python module inside) and runs from a fresh venv.
      - name: Smoke the built wheel
        run: bash scripts/rust_migration/wheel_smoke.sh dist/*.whl

      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  container:
    name: Container build (Dockerfile smoke)
    # ~8 minutes compiling the engine in Docker with no cache; the image
    # changes rarely -- main and the merge queue own the proof.
    if: github.event_name == 'push' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    # The image compiles the rust engine from source (no cargo cache in docker build).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t cairn:http-smoke .
      - name: Keyless wildcard entrypoint refuses to start
        run: |
          set +e
          out=$(docker run --rm --name cairn-smoke -e CAIRN_WORKSPACE=/data/ws --entrypoint /bin/sh cairn:http-smoke -c "cairn init --no-build >/dev/null 2>&1; cairn serve --host 0.0.0.0" 2>&1)
          rc=$?
          set -e
          echo "$out" | tail -3
          # D-004: with the store present, non-loopback bind without a key
          # exits 1 on the API-key refusal before binding.
          if [ "$rc" -eq 0 ]; then
            echo "::error::keyless container exited 0 (expected refusal exit 1)"
            exit 1
          fi
          echo "$out" | grep -q "without an API key"
      - name: Keyed entrypoint reaches /healthz
        run: |
          docker run -d --name cairn-keyed -e CAIRN_WORKSPACE=/data/ws -e CAIRN_MCP_API_KEY=ci-smoke-key -p 18765:9876 --entrypoint /bin/sh cairn:http-smoke -c "cairn init --no-build >/dev/null 2>&1; exec cairn serve --host 0.0.0.0"
          ok=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18765/healthz > /tmp/hz.json 2>/dev/null; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then echo "::error::healthz never came up"; docker logs cairn-keyed | tail -5; docker rm -f cairn-keyed; exit 1; fi
          grep -q '"status"' /tmp/hz.json
          docker rm -f cairn-keyed
