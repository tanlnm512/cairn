name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Merge queue: once the queue is enabled on main's branch protection, the
  # full matrix below gates the queued merge itself (same triggers as push).
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Security: supply-chain + code scanning -----------------------------
  # pip-audit is a HARD gate: a known-vulnerable dependency blocks the PR.
  # bandit is ADVISORY (continue-on-error): it surfaces NEW security
  # regressions (eval/exec/pickle/shell/weak-crypto) without churning on the
  # codebase's known-benign findings. B608 is skipped via -s because every SQL
  # query here is parameterized (f-strings interpolate only the `?,?,?`
  # placeholder list; values pass separately to execute()) -- the 26 B608 hits
  # are false positives. The B324 hashlib findings were silenced at the call
  # sites with usedforsecurity=False (content-addressing IDs, not crypto); the
  # only remaining hits are 2 B310 urllib fetches (timeout-bounded, to known
  # URLs) -- benign.
  security:
    name: Security (pip-audit + bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.1.0
      # Every job installs from the committed uv.lock (exact pinned set) via
      # `uv sync` -- the lockfile is the dependency set CI tests, not a fresh
      # pip resolution. `uv run --no-sync` then executes from that venv.
      # The sidecar extras ride the audit: they are user-facing install
      # surfaces (pip install cairn-intel[ingest]) -- a CVE there must fail it.
      - name: Install (with dev + sidecar extras)
        run: uv sync --extra dev --extra ingest --extra graph-analytics
      - name: pip-audit (hard gate -- known-vulnerable deps fail here)
        run: uv run --no-sync pip-audit
      - name: bandit (advisory)
        continue-on-error: true
        run: uv run --no-sync bandit -r src -ii -ll -s B608

  # --- Type checking: HARD gate --------------------------------------------
  # mypy runs clean at default settings (--ignore-missing-imports because
  # tree-sitter & friends ship no stubs) after the 0-error cleanup wave
  # (63 errors at adoption time). New type regressions now block CI, same
  # philosophy as the ruff gate.
  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Install (with dev extras)
        run: uv sync --extra dev
      - name: mypy
        run: uv run --no-sync mypy --ignore-missing-imports src

  # --- Conventional Commit PR-title gate (hard) ---------------------------
  # Mirrors the commitizen convention that `cz bump` derives the SemVer bump
  # from. Fails the PR if the title isn't `type(optional-scope): subject`.
  pr-title:
    name: PR title (conventional commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Types match commitizen's defaults + the ones in this repo's history.
          types: |
            feat
            fix
            chore
            docs
            ci
            refactor
            perf
            test
            build
            style
            revert
          requireScope: false

  # --- pre-commit: server-side enforcement of all Layer-0 gates ------------
  # Closes the gap where a dev who skipped `pre-commit install` could bypass
  # local gates. This is the single server-side home for ALL Layer-0 checks --
  # ruff (F-only), gitleaks (secrets), and the yaml/toml/large-file/debug
  # checks all live in .pre-commit-config.yaml and are binding only because
  # this job runs them. (The old standalone `lint` job was removed as
  # redundant: it ran the same `ruff check` this job runs.)
  pre-commit:
    name: pre-commit (all local gates)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Cache pre-commit hook envs
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Install (with dev extras)
        run: uv sync --extra dev
      - name: Run all hooks
        run: uv run --no-sync pre-commit run --all-files

  # --- Quality ratchet: audit-debt + comment-style stop-growth gates ------
  # Human modes keep the maintainer surface green; the JSON steps pin the
  # machine-readable contract report and tooling consume.
  quality-ratchet:
    name: Quality ratchet (audit debt + comment style)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Install (with dev extras)
        run: uv sync --extra dev
      - name: Audit status (human gate)
        run: make audit-status
      - name: Comment style (human gate)
        run: make comment-style
      - name: Parse quality-gate JSON outputs
        run: |
          uv run --no-sync python scripts/audit_status.py --json > audit-status.json
          uv run --no-sync python scripts/comment_style.py --json > comment-style.json
          python3 - <<'EOF'
          import json
          from pathlib import Path

          audit = json.loads(Path("audit-status.json").read_text())
          for priority in ("P0", "P1", "P2", "P3"):
              counts = audit["totals"][priority]
              assert set(counts) == {"total", "fixed", "remaining"}
              assert 0 <= counts["remaining"] <= counts["total"]
          assert audit["remaining"] == sum(
              counts["remaining"] for counts in audit["totals"].values()
          )

          style = json.loads(Path("comment-style.json").read_text())
          assert style["ok"] is True
          assert isinstance(style["remaining"], int)
          assert style["new"] == [] and style["stale"] == []
          EOF

  # --- Dependency review for PRs (supply-chain, complements pip-audit) -----
  # pip-audit scans the fully-resolved environment; this checks the *delta* a
  # PR introduces (new/changed deps) against the GitHub Advisory DB + licenses.
  dependency-review:
    name: Dependency review (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/dependency-review-action@v4

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: pre-commit
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares >=3.10; cover the supported CPython range.
        # PRs run the ceiling leg only (with xdist, minutes); every
        # merge-group entry and push to main runs the FULL matrix, so a
        # merge is always fully covered (with the queue enabled, the gate
        # runs on the queued merge itself). 3.14 is declared in classifiers
        # but very new -- wheel gaps fail loudly here, not silently pass.
        python-version: ${{ github.event_name != 'pull_request' && fromJSON('["3.10", "3.11", "3.12", "3.13", "3.14"]') || fromJSON('["3.14"]') }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install (with dev + ingest + graph-analytics extras)
        run: uv sync --extra dev --extra ingest --extra graph-analytics --python ${{ matrix.python-version }}

      - name: Validate skill eval specs
        run: uv run --no-sync python scripts/run_skill_evals.py

      - name: Run test suite
        # The infra tier (oracle replays against the release binary) runs in
        # rust-parity.yml, where the binary is built.
        run: uv run --no-sync pytest -q -m "not infra" --durations=25 --junitxml=test-results.xml

      - name: Publish test summary
        if: always()
        run: |
          # stdlib-only summary; system python3, no project venv needed.
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          import os
          path = "test-results.xml"
          if not os.path.exists(path):
              print("_(no test results — suite did not run)_")
          else:
              # junit XML: <testsuites><testsuite tests=... failures=... .../>
              # stats live on the <testsuite> child, not the <testsuites> root.
              root = ET.parse(path).getroot()
              suite = root if root.tag == "testsuite" else root.find("testsuite")
              if suite is None:
                  print("_(malformed test results)_")
              else:
                  n, fail, err, skip = (
                      suite.get(k, "0") for k in ("tests", "failures", "errors", "skipped")
                  )
                  ok = int(fail) == 0 and int(err) == 0
                  print(f"## Test results (Python ${{ matrix.python-version }})")
                  print()
                  print(f"{'✅' if ok else '❌'} **{n}** tests | "
                        f"✗ {fail} failures | "
                        f"⚠ {err} errors | "
                        f"⊘ {skip} skipped")
          EOF


  # Packaging canary, MAIN PUSHES ONLY: verifies `python -m build` (sdist +
  # wheel) stays green on every merge so packaging breakage surfaces between
  # releases, never at tag time (release.yml builds the real multi-platform
  # wheels there). PRs skip it deliberately -- their wheel-build cost buys no
  # signal the test legs don't already give, and the canary still runs on the
  # merge commit itself.
  build:
    name: Build wheel + sdist
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.1.0

      - name: Build distributions
        run: |
          uv sync --extra dev
          uv run --no-sync python -m build

      - name: Verify the wheel imports
        run: |
          uv pip install --python .venv/bin/python dist/*.whl
          uv run --no-sync python -c "import cairn; print('ok')"

      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  container:
    name: Container build (Dockerfile smoke)
    runs-on: ubuntu-latest
    # The image compiles the rust engine from source (no cargo cache in docker build).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t cairn:http-smoke .
      - name: Keyless wildcard entrypoint refuses to start
        run: |
          set +e
          out=$(docker run --rm --name cairn-smoke -e CAIRN_WORKSPACE=/data/ws --entrypoint /bin/sh cairn:http-smoke -c "cairn init --no-build >/dev/null 2>&1; cairn serve --host 0.0.0.0" 2>&1)
          rc=$?
          set -e
          echo "$out" | tail -3
          # D-004: with the store present, non-loopback bind without a key
          # exits 1 on the API-key refusal before binding.
          if [ "$rc" -eq 0 ]; then
            echo "::error::keyless container exited 0 (expected refusal exit 1)"
            exit 1
          fi
          echo "$out" | grep -q "without an API key"
      - name: Keyed entrypoint reaches /healthz
        run: |
          docker run -d --name cairn-keyed -e CAIRN_WORKSPACE=/data/ws -e CAIRN_MCP_API_KEY=ci-smoke-key -p 18765:9876 --entrypoint /bin/sh cairn:http-smoke -c "cairn init --no-build >/dev/null 2>&1; exec cairn serve --host 0.0.0.0"
          ok=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18765/healthz > /tmp/hz.json 2>/dev/null; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then echo "::error::healthz never came up"; docker logs cairn-keyed | tail -5; docker rm -f cairn-keyed; exit 1; fi
          grep -q '"status"' /tmp/hz.json
          docker rm -f cairn-keyed
