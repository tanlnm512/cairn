name: Release

# Cut the GitHub Release on tag push (v*). Binary tarballs are built and
# attached by release-rust.yml; this workflow owns the Release object and its
# changelog notes.
#
# Release flow (see docs/release-checklist.md "Cutting a release" for details):
#   1. finalize CHANGELOG.md: move [Unreleased] -> [X.Y.Z] - YYYY-MM-DD
#   2. `cargo xtask bump`  -- moves every version file, commits, tags vX.Y.Z
#   3. `git push origin main && git push origin vX.Y.Z`  -- triggers this workflow

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # softprops/action-gh-release creates the GitHub Release

# Serialize releases: two tags landing close together must not race on the
# same GitHub Release target.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      # CHANGELOG.md lives in the repo; the changelog-extraction step below
      # needs the source tree.
      - uses: actions/checkout@v5

      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Pull just this release's section out of CHANGELOG.md (keep-a-changelog
      # format: `## [X.Y.Z] - YYYY-MM-DD` headers). Stops at the next version
      # header so the body contains only this release's notes, not the whole
      # changelog.
      - name: Extract changelog section for this version
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            /^## \[/ {
              if ($0 ~ "\["v"\]") { in_section=1; print; next }
              else { in_section=0 }
            }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || \
            echo "No CHANGELOG.md section for $VERSION -- check the release flow." >&2

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: false
