name: Release

# Publish cairn-intel to PyPI on tag push (v*), then cut a GitHub Release.
# Uses PyPI Trusted Publishing -- no API tokens. Configure once:
#   https://pypi.org/manage/project/cairn-intel/settings/publishing/
#   GitHub publisher: tanlnm512/cairn, environment: pypi, default branch: main
#
# Release flow (see docs/release-checklist.md "Cutting a release" for details):
#   1. finalize CHANGELOG.md: move [Unreleased] -> [X.Y.Z] - YYYY-MM-DD
#   2. `cz bump --yes`  -- bumps pyproject.toml, commits, tags vX.Y.Z
#   3. `git push origin main && git push origin vX.Y.Z`  -- triggers this workflow

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # softprops/action-gh-release creates the GitHub Release

# Serialize releases: two tags landing close together must not publish
# concurrently (PyPI rejects a same-version double-upload, and GitHub
# Releases would race on the same target).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Every wheel is the cairn-cli binary built by maturin straight from the
  # cargo workspace (`[tool.maturin] bindings = "bin"` in pyproject.toml):
  # tagged py3-none-<platform>, no Python module inside. One leg per rust
  # target on its platform's runner family; the linux legs cross-build on the
  # host through zig (no QEMU, no container), so one ubuntu runner covers
  # glibc and musl on both arches.
  wheels:
    name: Wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,   manylinux: auto,          zig: "--zig", smoke: true }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu,  manylinux: auto,          zig: "--zig", smoke: false }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl,  manylinux: musllinux_1_2, zig: "--zig", smoke: false }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2, zig: "--zig", smoke: false }
          - { os: macos-15-intel, target: x86_64-apple-darwin,        manylinux: auto,          zig: "",      smoke: true }
          - { os: macos-latest,   target: aarch64-apple-darwin,       manylinux: auto,          zig: "",      smoke: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,     manylinux: auto,          zig: "",      smoke: true }
    steps:
      - uses: actions/checkout@v5

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist ${{ matrix.zig }}

      # Installed-product smoke on the legs whose runner can install its own
      # wheel; cross-built arches and musl wheels cannot be installed here.
      - uses: actions/setup-python@v6
        if: matrix.smoke
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.1.0
        if: matrix.smoke
      - name: Smoke the built wheel
        if: matrix.smoke
        shell: bash
        run: bash scripts/rust_migration/wheel_smoke.sh dist/*.whl

      # Unique artifact name per upload -- upload-artifact rejects a
      # duplicate name within one job (409), and same-name merging across
      # jobs is not a v4+ guarantee. Both consumers below pattern-download
      # dist-* with merge-multiple.
      - uses: actions/upload-artifact@v6
        with:
          name: dist-wheel-${{ matrix.target }}
          path: dist/

  # The sdist carries the cargo workspace (crates, vendored sqlite-vec and
  # grammar sources, lockfile) so `pip install --no-binary cairn-intel`
  # compiles the engine with a Rust toolchain.
  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: dist-sdist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [wheels, sdist]
    environment:
      name: pypi             # must match the Trusted Publisher environment name
      url: https://pypi.org/project/cairn-intel/
    permissions:
      id-token: write        # Trusted Publishing needs OIDC; no API token
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      # PyPA's official action. With Trusted Publishing it exchanges the
      # OIDC token from the `pypi` environment for an upload credential --
      # no PYPI_API_TOKEN secret required.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true   # SLSA build attestations on each artifact
          # A retried publish (moved tag after a partial failure) skips files
          # already on PyPI and uploads only what is missing.
          skip-existing: true

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: publish-pypi
    steps:
      # CHANGELOG.md lives in the repo; the changelog-extraction step below
      # needs the source tree (download-artifact only restores dist/).
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v6
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Pull just this release's section out of CHANGELOG.md (keep-a-changelog
      # format: `## [X.Y.Z] - YYYY-MM-DD` headers). Stops at the next version
      # header so the body contains only this release's notes, not the whole
      # changelog.
      - name: Extract changelog section for this version
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            /^## \[/ {
              if ($0 ~ "\\["v"\\]") { in_section=1; print; next }
              else { in_section=0 }
            }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || \
            echo "No CHANGELOG.md section for $VERSION -- check the release flow." >&2

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          files: dist/*
          draft: false
          prerelease: false
