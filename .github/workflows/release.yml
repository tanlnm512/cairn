name: Release

# Publish cairn-intel to PyPI on tag push (v*), then cut a GitHub Release.
# Uses PyPI Trusted Publishing -- no API tokens. Configure once:
#   https://pypi.org/manage/project/cairn-intel/settings/publishing/
#   GitHub publisher: tanlnm512/cairn, environment: pypi, default branch: main
#
# Release flow (see docs/release-checklist.md "Cutting a release" for details):
#   1. finalize CHANGELOG.md: move [Unreleased] -> [X.Y.Z] - YYYY-MM-DD
#   2. `cz bump --yes`  -- bumps pyproject.toml + __init__.py, commits, tags vX.Y.Z
#   3. `git push origin main && git push origin vX.Y.Z`  -- triggers this workflow

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # softprops/action-gh-release creates the GitHub Release

# Serialize releases: two tags landing close together must not publish
# concurrently (PyPI rejects a same-version double-upload, and GitHub
# Releases would race on the same target).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build wheel + sdist (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      # Linux aarch64 legs build under QEMU emulation inside cibuildwheel's
      # docker containers (D-008).
      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      # The sdist is built once, on the linux leg; every leg adds its
      # platform wheels below.
      - name: Set up Python
        if: runner.os == 'Linux'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        if: runner.os == 'Linux'
        uses: astral-sh/setup-uv@v6

      - name: Build sdist
        if: runner.os == 'Linux'
        run: uv build --sdist

      # cp310-* + setup.py's py_limited_api -> one cp310-abi3 wheel per
      # platform (cibuildwheel auto-runs abi3audit on it). Supported: macOS
      # Apple Silicon, manylinux x86_64 + aarch64, Windows AMD64. musllinux
      # is skipped: sqlite-vec (core dep) ships no musl wheels, so an Alpine
      # install can never resolve. Intel macOS is skipped: cryptography
      # (transitive via mcp -> pyjwt[crypto]) dropped Intel-macOS wheels and
      # fresh resolution there falls to a Rust sdist build. Pinned exactly:
      # cibuildwheel minor releases add/remove platforms (their FAQ mandates
      # exact pins).
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        with:
          output-dir: wheelhouse
        env:
          CIBW_BUILD: "cp310-*"
          CIBW_SKIP: "*musllinux*"
          CIBW_ARCHS_LINUX: "x86_64 aarch64"
          CIBW_ARCHS_MACOS: "arm64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_TEST_REQUIRES: tree_sitter
          # Smoke-test the compiled grammar in every wheel (supersedes the
          # old post-build "Verify the wheel imports" step).
          CIBW_TEST_COMMAND: >-
            python -c "import cairn._tree_sitter_kotlin as m; from tree_sitter import Language, Parser;
            assert not Parser(Language(m.language())).parse(b'class Foo').root_node.has_error"

      # Same artifact name across legs -- upload-artifact merges same-named
      # artifacts, so publish-pypi / github-release below download the full
      # set (all wheels + sdist) unchanged.
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: wheelhouse/

      - name: Upload sdist
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi             # must match the Trusted Publisher environment name
      url: https://pypi.org/project/cairn-intel/
    permissions:
      id-token: write        # Trusted Publishing needs OIDC; no API token
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/

      # PyPA's official action. With Trusted Publishing it exchanges the
      # OIDC token from the `pypi` environment for an upload credential --
      # no PYPI_API_TOKEN secret required.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true   # SLSA build attestations on each artifact

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: publish-pypi
    steps:
      # CHANGELOG.md lives in the repo; the changelog-extraction step below
      # needs the source tree (download-artifact only restores dist/).
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/

      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Pull just this release's section out of CHANGELOG.md (keep-a-changelog
      # format: `## [X.Y.Z] - YYYY-MM-DD` headers). Stops at the next version
      # header so the body contains only this release's notes, not the whole
      # changelog.
      - name: Extract changelog section for this version
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            /^## \[/ {
              if ($0 ~ "\\["v"\\]") { in_section=1; print; next }
              else { in_section=0 }
            }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || \
            echo "No CHANGELOG.md section for $VERSION -- check the release flow." >&2

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          files: dist/*
          draft: false
          prerelease: false
