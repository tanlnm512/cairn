name: Release

# Publish cairn-intel to PyPI on tag push (v*), then cut a GitHub Release.
# Uses PyPI Trusted Publishing -- no API tokens. Configure once:
#   https://pypi.org/manage/project/cairn-intel/settings/publishing/
#   GitHub publisher: tanlnm512/cairn, environment: pypi, default branch: main
#
# Release flow (see docs/release-checklist.md "Cutting a release" for details):
#   1. finalize CHANGELOG.md: move [Unreleased] -> [X.Y.Z] - YYYY-MM-DD
#   2. `cz bump --yes`  -- bumps pyproject.toml + __init__.py, commits, tags vX.Y.Z
#   3. `git push origin main && git push origin vX.Y.Z`  -- triggers this workflow

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # softprops/action-gh-release creates the GitHub Release

# Serialize releases: two tags landing close together must not publish
# concurrently (PyPI rejects a same-version double-upload, and GitHub
# Releases would race on the same target).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build wheel + sdist (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      # Linux aarch64 legs build under QEMU emulation inside cibuildwheel's
      # docker containers (D-008).
      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      # The sdist is built once, on the linux leg; every leg adds its
      # platform wheels below.
      - name: Set up Python
        if: runner.os == 'Linux'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        if: runner.os == 'Linux'
        uses: astral-sh/setup-uv@v6

      - name: Build sdist
        if: runner.os == 'Linux'
        run: uv build --sdist

      # --- Rust engine binary for the bundled-binary wheels -------------------
      # Runs after the sdist build so the sdist stays binary-free. The macOS
      # arm64 wheel bundles the aarch64-apple-darwin binary; the manylinux
      # x86_64/aarch64 wheels bundle the musl-static Linux binaries -- the
      # same per-target bytes the tarball channel ships, cross-built like
      # release-rust.yml (static binaries exec on glibc). Windows has no
      # engine target and no longer gets a wheel: the package is only the
      # launcher for the bundled binary.

      - name: Set up Rust (aarch64-apple-darwin)
        if: runner.os == 'macOS'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        if: runner.os == 'macOS'
        with:
          workspaces: rust
          key: wheel-aarch64-apple-darwin

      - name: Build rust engine (aarch64-apple-darwin)
        if: runner.os == 'macOS'
        working-directory: rust
        run: cargo build --release --target aarch64-apple-darwin -p cairn-cli

      # Injected as package data ([tool.setuptools.package-data] "cairn" =
      # ["_bin/*"]); fails loudly here so no engine-less wheel can ship.
      - name: Bundle rust engine into package data
        if: runner.os == 'macOS'
        run: |
          mkdir -p src/cairn/_bin
          cp rust/target/aarch64-apple-darwin/release/cairn src/cairn/_bin/cairn
          chmod 755 src/cairn/_bin/cairn
          test -x src/cairn/_bin/cairn

      - name: Set up Rust (linux musl targets)
        if: runner.os == 'Linux'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        if: runner.os == 'Linux'
        with:
          workspaces: rust
          key: wheel-linux-musl

      - name: Install cargo-zigbuild
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild,zig

      - name: Build rust engines (musl-static)
        if: runner.os == 'Linux'
        working-directory: rust
        run: |
          # zigbuild compiles on the host with zig as the toolchain: no
          # container, so no glibc boundary between runner and cross image.
          cargo zigbuild --release --target x86_64-unknown-linux-musl -p cairn-cli
          cargo zigbuild --release --target aarch64-unknown-linux-musl -p cairn-cli

      - name: Verify static link (musl)
        if: runner.os == 'Linux'
        run: |
          for tgt in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            out=$(file "rust/target/$tgt/release/cairn")
            echo "$out"
            echo "$out" | grep -Eq 'statically linked|static-pie linked'
          done

      # The package is pure Python; setup.py tags the wheel py3-none-<platform>
      # because it carries the platform binary, so one build per platform
      # (cp310-*) covers every supported interpreter. Supported: macOS Apple
      # Silicon, manylinux x86_64 + aarch64. musllinux is skipped: those users
      # are served by the tarball/binstall channel. Pinned exactly: cibuildwheel
      # minor releases add/remove platforms (their FAQ mandates exact pins).
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        with:
          output-dir: wheelhouse
        env:
          CIBW_BUILD: "cp310-*"
          CIBW_SKIP: "*musllinux*"
          CIBW_ARCHS_LINUX: "x86_64 aarch64"
          CIBW_ARCHS_MACOS: "arm64"
          # Copy the matching musl binary into package data inside each arch's
          # build container (the repo root is the container's /project, so the
          # host-built binaries at rust/target/ are visible); a missing or
          # wrong-arch binary fails the wheel build loudly.
          CIBW_BEFORE_BUILD_LINUX: |
            set -eux
            case "$(uname -m)" in
              x86_64) tgt=x86_64-unknown-linux-musl ;;
              aarch64) tgt=aarch64-unknown-linux-musl ;;
              *) echo "unexpected arch: $(uname -m)" >&2; exit 1 ;;
            esac
            mkdir -p src/cairn/_bin
            cp "rust/target/$tgt/release/cairn" src/cairn/_bin/cairn
            chmod 755 src/cairn/_bin/cairn
            test -x src/cairn/_bin/cairn
          # Smoke-test every wheel: the bundled binary is discoverable and the
          # console script execs it.
          CIBW_TEST_COMMAND: >-
            python -c "from cairn import paths; assert paths.bundled_binary() is not None"
            && cairn --version

      # Unique artifact name per upload -- upload-artifact rejects a
      # duplicate name within one job (409), and same-name merging across
      # jobs is not a v4+ guarantee. Both consumers below pattern-download
      # dist-* with merge-multiple.
      - uses: actions/upload-artifact@v6
        with:
          name: dist-wheels-${{ matrix.os }}
          path: wheelhouse/

      - name: Upload sdist
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: dist-sdist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi             # must match the Trusted Publisher environment name
      url: https://pypi.org/project/cairn-intel/
    permissions:
      id-token: write        # Trusted Publishing needs OIDC; no API token
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      # PyPA's official action. With Trusted Publishing it exchanges the
      # OIDC token from the `pypi` environment for an upload credential --
      # no PYPI_API_TOKEN secret required.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true   # SLSA build attestations on each artifact

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: publish-pypi
    steps:
      # CHANGELOG.md lives in the repo; the changelog-extraction step below
      # needs the source tree (download-artifact only restores dist/).
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v6
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Pull just this release's section out of CHANGELOG.md (keep-a-changelog
      # format: `## [X.Y.Z] - YYYY-MM-DD` headers). Stops at the next version
      # header so the body contains only this release's notes, not the whole
      # changelog.
      - name: Extract changelog section for this version
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            /^## \[/ {
              if ($0 ~ "\\["v"\\]") { in_section=1; print; next }
              else { in_section=0 }
            }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || \
            echo "No CHANGELOG.md section for $VERSION -- check the release flow." >&2

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          files: dist/*
          draft: false
          prerelease: false
