name: Release

# Publish cairn-intel wheels + sdist to PyPI and cut the GitHub Release on
# tag push (v*). Binary tarballs are built and attached by release-rust.yml.
#
# PyPI Trusted Publishing (OIDC, no API tokens):
#   https://pypi.org/manage/project/cairn-intel/settings/publishing/
#   GitHub publisher: tanlnm512/cairn, environment: pypi, default branch: main
#
# Release flow (see docs/release-checklist.md "Cutting a release" for details):
#   1. finalize CHANGELOG.md: move [Unreleased] -> [X.Y.Z] - YYYY-MM-DD
#   2. `cargo xtask bump`  -- moves every version file, commits, tags vX.Y.Z
#   3. `git push origin main && git push origin vX.Y.Z`  -- triggers this workflow

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # softprops/action-gh-release creates the GitHub Release

# Serialize releases: two tags landing close together must not race on PyPI
# or the same GitHub Release target.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Every wheel is the cairn-cli binary built by maturin (`[tool.maturin]
  # bindings = "bin"` in pyproject.toml): tagged py3-none-<platform>.
  wheels:
    name: Wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,   manylinux: auto,          zig: "--zig", smoke: true }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu,  manylinux: auto,          zig: "--zig", smoke: false }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl,  manylinux: musllinux_1_2, zig: "--zig", smoke: false }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2, zig: "--zig", smoke: false }
          - { os: macos-latest,   target: x86_64-apple-darwin,        manylinux: auto,          zig: "",      smoke: false }
          - { os: macos-latest,   target: aarch64-apple-darwin,       manylinux: auto,          zig: "",      smoke: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,     manylinux: auto,          zig: "",      smoke: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build wheel
        uses: PyO3/maturin-action@3e2bdf6ba6453a61e649744019b8a2d906c7eb38 # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist ${{ matrix.zig }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.smoke
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: matrix.smoke
      - name: Smoke the built wheel
        if: matrix.smoke
        shell: bash
        run: bash scripts/wheel-smoke.sh dist/*.whl

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-wheel-${{ matrix.target }}
          path: dist/

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      - name: Build sdist
        uses: PyO3/maturin-action@3e2bdf6ba6453a61e649744019b8a2d906c7eb38 # v1.51.0
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sdist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [wheels, sdist]
    environment:
      name: pypi
      url: https://pypi.org/project/cairn-intel/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@aef6c9b6e301dc803e1bc9133e9ce67ae9b0906b # v1.14.3
        with:
          attestations: true
          skip-existing: true

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      # CHANGELOG.md lives in the repo; the changelog-extraction step below
      # needs the source tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Pull just this release's section out of CHANGELOG.md (keep-a-changelog
      # format: `## [X.Y.Z] - YYYY-MM-DD` headers). Stops at the next version
      # header so the body contains only this release's notes, not the whole
      # changelog.
      - name: Extract changelog section for this version
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            /^## \[/ {
              if ($0 ~ "\\["v"\\]") { in_section=1; print; next }
              else { in_section=0 }
            }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || {
            echo "No CHANGELOG.md section for $VERSION -- check the release flow." >&2
            exit 1
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: ${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: false
