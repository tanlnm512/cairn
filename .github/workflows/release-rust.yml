name: Rust release

# Build the Rust `cairn` binary for the distribution matrix on tag push (v*),
# attach tarballs + sha256 checksums to the GitHub Release that release.yml
# owns (one v* tag ships binaries + the extension vsix); `cargo binstall --git`
# resolves those assets from cairn-cli's binstall metadata.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # softprops/action-gh-release attaches the binary assets

# Serialize per-ref: a re-run must not race itself on the same Release.
concurrency:
  group: release-rust-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            cross: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ". -> rust/target"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross == true
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
        with:
          tool: cross

      - name: Build (cargo)
        if: matrix.cross != true
        run: cargo build --release --target ${{ matrix.target }} -p cairn-cli

      - name: Build (cross)
        if: matrix.cross == true
        run: cross build --release --target ${{ matrix.target }} -p cairn-cli

      - name: Verify static link (musl)
        if: contains(matrix.target, 'musl')
        run: |
          out=$(file "rust/target/${{ matrix.target }}/release/cairn")
          echo "$out"
          echo "$out" | grep -Eq 'statically linked|static-pie linked'

      - name: Package tarball + checksum
        env:
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          version="${REF_NAME#v}"
          mkdir dist
          bin="rust/target/${{ matrix.target }}/release/cairn"
          [ -f "$bin" ] || bin="$bin.exe"   # windows builds carry the .exe name
          cp "$bin" dist/
          member="$(basename "$bin")"
          tar -czf "cairn-cli-${version}-${{ matrix.target }}.tar.gz" -C dist "$member"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "cairn-cli-${version}-${{ matrix.target }}.tar.gz" \
              > "cairn-cli-${version}-${{ matrix.target }}.tar.gz.sha256"
          else
            shasum -a 256 "cairn-cli-${version}-${{ matrix.target }}.tar.gz" \
              > "cairn-cli-${version}-${{ matrix.target }}.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-bin-${{ matrix.target }}
          path: |
            cairn-cli-*.tar.gz
            cairn-cli-*.tar.gz.sha256

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rust-bin-*
          merge-multiple: true
          path: dist/

      - name: Attach binaries to the GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
