name: Weekly smoke

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: CLI replay (vendored fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAIRN_TELEMETRY: "off"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ". -> rust/target"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: release-cli
      - name: Build cairn
        run: |
          cargo build --release --manifest-path Cargo.toml -p cairn-cli
          echo "$GITHUB_WORKSPACE/rust/target/release" >> "$GITHUB_PATH"
      - name: Build fixture graph
        env:
          SMOKE_ROOT: ${{ runner.temp }}/weekly-smoke
        run: |
          mkdir -p "$SMOKE_ROOT"
          cp -R rust/golden/stores/yarl/corpus "$SMOKE_ROOT/yarl"
          # The scanner needs a repo marker; the pinned corpus ships without one.
          mkdir "$SMOKE_ROOT/yarl/.git"
          cairn build \
            --workspace "$SMOKE_ROOT" \
            --db "$SMOKE_ROOT/cairn.kg"
      - name: Replay CLI commands
        env:
          SMOKE_ROOT: ${{ runner.temp }}/weekly-smoke
        run: >
          cargo xtask cli-smoke
          .github/smoke/cli-commands.txt
          --fixture "$SMOKE_ROOT/yarl"
          --db "$SMOKE_ROOT/cairn.kg"
