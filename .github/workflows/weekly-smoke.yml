name: Weekly smoke

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: CLI replay (vendored fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAIRN_TELEMETRY: "off"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build cairn
        run: |
          cargo build --release --manifest-path rust/Cargo.toml -p cairn-cli
          echo "$GITHUB_WORKSPACE/rust/target/release" >> "$GITHUB_PATH"
      - name: Build fixture graph
        env:
          SMOKE_ROOT: ${{ runner.temp }}/weekly-smoke
        run: |
          mkdir -p "$SMOKE_ROOT"
          cp -R rust/golden/stores/yarl/corpus "$SMOKE_ROOT/yarl"
          # The scanner needs a repo marker; the pinned corpus ships without one.
          mkdir "$SMOKE_ROOT/yarl/.git"
          cairn build \
            --workspace "$SMOKE_ROOT" \
            --db "$SMOKE_ROOT/cairn.kg"
      - name: Replay CLI commands
        env:
          SMOKE_ROOT: ${{ runner.temp }}/weekly-smoke
        run: >
          python scripts/run_cli_smoke.py
          .github/smoke/cli-commands.txt
          --fixture "$SMOKE_ROOT/yarl"
          --db "$SMOKE_ROOT/cairn.kg"
