name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # --- Gates: fmt, clippy, tests, cargo-deny (advisories + licenses) -------
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install toolchain
        run: rustup toolchain install
      - name: cargo fmt --check
        run: cargo fmt --manifest-path Cargo.toml --all -- --check

  clippy:
    name: clippy (-D warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ". -> rust/target"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo clippy
        run: cargo clippy --manifest-path Cargo.toml --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ". -> rust/target"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo test
        # No release build here: the replay tests skip via this env, and the
        # real replays run in rust-parity.yml against a release build.
        run: cargo test --manifest-path Cargo.toml --workspace
        env:
          CAIRN_ALLOW_MISSING_GOLDENS: 1

  windows:
    name: windows (clippy + test + release build)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install toolchain
        run: |
          rustup toolchain install
          rustup target add x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ". -> rust/target"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: x86_64-pc-windows-msvc
      - name: cargo clippy
        run: cargo clippy --manifest-path Cargo.toml --workspace --all-targets -- -D warnings
      - name: cargo test
        # no-fail-fast surfaces every platform mismatch in one run.
        run: cargo test --manifest-path Cargo.toml --workspace --no-fail-fast
        env:
          CAIRN_ALLOW_MISSING_GOLDENS: 1
      - name: cargo build (release)
        # PRs already compile the workspace twice above; main proves the release profile.
        if: github.event_name != 'pull_request'
        run: cargo build --manifest-path Cargo.toml --release --target x86_64-pc-windows-msvc -p cairn-cli

  deny:
    name: cargo-deny (advisories + licenses)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
        with:
          tool: cargo-deny
      - name: cargo deny check
        run: cargo deny --config rust/deny.toml check advisories licenses
