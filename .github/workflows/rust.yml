name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # --- Gates: fmt, clippy, tests, cargo-deny (advisories + licenses) -------
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --manifest-path Cargo.toml --all -- --check

  clippy:
    name: clippy (-D warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> rust/target"
      - name: cargo clippy
        run: cargo clippy --manifest-path Cargo.toml --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> rust/target"
      - name: cargo test
        run: cargo test --manifest-path Cargo.toml --workspace

  windows:
    name: windows (clippy + test + release build)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> rust/target"
          key: x86_64-pc-windows-msvc
      - name: cargo clippy
        run: cargo clippy --manifest-path Cargo.toml --workspace --all-targets -- -D warnings
      - name: cargo test
        # no-fail-fast surfaces every platform mismatch in one run.
        run: cargo test --manifest-path Cargo.toml --workspace --no-fail-fast
      - name: cargo build (release)
        run: cargo build --manifest-path Cargo.toml --release --target x86_64-pc-windows-msvc -p cairn-cli

  deny:
    name: cargo-deny (advisories + licenses)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> rust/target"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny check
        run: cargo deny --config rust/deny.toml check advisories licenses

  # --- Release dry-run build matrix: compile-only proof per target; --------
  # no artifacts published here (real distribution lands in Phase 3).
  build-release:
    name: release build (${{ matrix.target }})
    needs: [fmt, clippy, test, deny]
    # Cross-target compile proof is release-shaped; clippy+test already
    # compile the workspace on every PR.
    if: github.event_name == 'push' || github.event_name == 'merge_group'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            cross: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> rust/target"
          key: ${{ matrix.target }}
      - name: Install cross
        if: matrix.cross == true
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build (cargo)
        if: matrix.cross != true
        run: cargo build --release --target ${{ matrix.target }}
      - name: Build (cross)
        if: matrix.cross == true
        run: cross build --release --target ${{ matrix.target }}
      - name: Verify static link (musl)
        if: contains(matrix.target, 'musl')
        run: |
          out=$(file "rust/target/${{ matrix.target }}/release/cairn")
          echo "$out"
          echo "$out" | grep -Eq 'statically linked|static-pie linked'
