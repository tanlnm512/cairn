name: Rust parity gates

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "rust/**"
      - "scripts/g2_check.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust-parity.yml"

permissions:
  contents: read

concurrency:
  group: rust-parity-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CAIRN_TELEMETRY: "off"

jobs:
  # --- Cheap oracles: run on PRs and nightly -------------------------------
  parity:
    name: parity (self) + cli golden + G2 base
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ". -> rust/target"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: release-cli
      - name: Build rust cairn (release)
        run: cargo build --release --manifest-path Cargo.toml -p cairn-cli
      - name: Build serve_search example
        run: cargo build --release --manifest-path Cargo.toml -p cairn-daemon --example serve_search
      - name: parity replay (self)
        run: cargo xtask parity --store self
      - name: cli golden
        run: cargo xtask cli-golden
      - name: G2 (base leg)
        run: bash scripts/g2_check.sh

  # --- Nightly and dispatch only -------------------------------------------
  parity-stores:
    name: parity (yarl, attrs)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ". -> rust/target"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: release-cli
      - name: Build rust cairn (release)
        run: cargo build --release --manifest-path Cargo.toml -p cairn-cli
      - name: parity replay (yarl)
        run: cargo xtask parity --store yarl
      - name: parity replay (attrs)
        run: cargo xtask parity --store attrs

  g2-legs:
    name: G2 (rebuild + staging legs)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ". -> rust/target"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: release-cli
      - name: Build rust cairn (release)
        run: cargo build --release --manifest-path Cargo.toml -p cairn-cli
      - name: G2 (rebuild + staging legs)
        env:
          G2_LEGS: rebuild,staging
        run: bash scripts/g2_check.sh

