# Force fully-static libc linkage on the musl release targets so the
# statically-linked assertion in release-rust.yml holds on every arch.
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]
