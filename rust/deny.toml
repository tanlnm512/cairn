# Advisories + licenses only; bans/sources are not wired.
# Extend `allow` as dependency batches land; unknown licenses deny.

[advisories]
version = 2
yanked = "deny"
ignore = [
    # ttf-parser via pdf-extract->lopdf is unmaintained; no fixed release exists.
    { id = "RUSTSEC-2026-0192", reason = "transitive of pdf-extract 0.12.1; text extraction does not parse untrusted fonts" },
    # paste via fastembed->ort (local-embed feature graph) is unmaintained; no fixed release exists.
    { id = "RUSTSEC-2024-0436", reason = "transitive macro utility of ort 2.0.0-rc.15 behind the opt-in local-embed feature; unmaintained upstream, no vulnerability" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
