[package]
name = "cairn-daemon"
description = "Streamable-HTTP MCP server: bearer auth, healthz, launchd/reuse lifecycle."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
cairn-query = { path = "../cairn-query" }
cairn-store = { path = "../cairn-store" }
rmcp = { version = "=3.9.0", features = ["transport-streamable-http-server"] }
rusqlite = { version = "=0.41.1", features = ["bundled"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal"] }
tokio-util = "0.7"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }

[features]
local-embed = ["cairn-query/local-embed"]

[lints]
workspace = true
