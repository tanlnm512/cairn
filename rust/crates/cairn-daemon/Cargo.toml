[package]
name = "cairn-daemon"
description = "Streamable-HTTP MCP server: bearer auth, healthz, launchd/reuse lifecycle."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
cairn-store = { path = "../cairn-store" }
rmcp = { version = "=3.5.1", features = ["transport-streamable-http-server"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal"] }
tokio-util = "0.7"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }

[dev-dependencies]
regex = "1"

[lints]
workspace = true
