[package]
name = "cairn-build"
description = "Scanner, parallel builder, resolver, incremental graft, streaming closure."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled"] }
cairn-parse = { path = "../cairn-parse" }
cairn-store = { path = "../cairn-store" }
rayon = "=1.12.0"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "=0.10.9"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
