# Layer 0 of the review/audit pipeline: the local gate.
#
# Runner: prek (`cargo binstall prek`, `brew install prek` or `uv tool install prek`).
# Install (once):  prek install
# Update revs:     prek auto-update
# Run on everything: prek run --all-files

repos:
  # --- Secret scanning. Catches API keys / tokens / .env blobs before they
  # reach the remote. Cheap insurance for a repo that ships agent-integration
  # templates and CLI wiring.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # --- Read-only hygiene: prek's native hooks; none modify files.
  - repo: builtin
    hooks:
      - id: check-yaml          # workflows, agent templates, .cairn YAML
      - id: check-toml          # Cargo and pyproject manifests
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
        # Docs diagram artifacts, pinned parity-store bytes, and the frozen
        # canonical-dump reference are large by design.
        exclude: ^docs/diagrams/|^rust/golden/(stores|nav|search|spike)/.*\.kg$|^rust/golden/dump/self-corpus\.norm\.txt$

  # --- Comment-style ratchet: local mirror of the quality-ratchet CI job.
  # The checker owns its scope (rust/crates), so it never receives
  # filenames and runs on every commit regardless of what is staged.
  - repo: local
    hooks:
      - id: check-comment-lengths
        name: check comment/doc-block lengths (shrink-only baseline)
        entry: bash -c 'export PATH="$HOME/.cargo/bin:$PATH"; exec cargo xtask comment-style'
        language: system
        pass_filenames: false
        always_run: true

  # --- Rust gates: local mirror of the Rust CI leg. GATE-only (fmt runs
  # with --check, never rewrites). The standard rustup bin
  # dir is prepended to PATH so non-interactive shells find the toolchain;
  # runs only when rust/ files are staged.
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check (rust workspace)
        entry: bash -c 'export PATH="$HOME/.cargo/bin:$PATH"; exec cargo fmt --manifest-path Cargo.toml --all -- --check'
        language: system
        pass_filenames: false
        files: ^rust/.*\.rs$
      - id: cargo-clippy
        name: cargo clippy -D warnings (rust workspace)
        entry: bash -c 'export PATH="$HOME/.cargo/bin:$PATH"; exec cargo clippy --manifest-path Cargo.toml --workspace --all-targets -- -D warnings'
        language: system
        pass_filenames: false
        files: ^rust/(.*\.(rs|toml)|Cargo\.lock)$

  # NOTE: `cargo xtask verify-no-code-change` is deliberately NOT wired here.
  # It compares the *working tree* against HEAD, but pre-commit always stashes
  # unstaged changes and runs against the *staged* tree -- so as a hook it
  # would silently Skip precisely when you need it (unstaged comment edits).
  # Keep it as a direct invocation, which sees the real working tree:
  #   make verify-no-code-change            # uncommitted edits
  #   make verify-no-code-change REF=HEAD~1 # a just-made commit
