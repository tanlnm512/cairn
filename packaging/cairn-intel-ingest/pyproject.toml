[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cairn-intel-ingest"
version = "0.23.1"
description = "Optional high-fidelity PDF-to-markdown converter for the cairn engine"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Tan Le"},
]
keywords = ["code-intelligence", "pdf", "markdown", "cairn"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

# The engine's native PDF extraction is the default; this package is installed
# only by users who want pymupdf4llm's higher fidelity. pymupdf4llm is AGPL-3.0
# and lives here, never in the engine binary.
dependencies = [
    "pymupdf4llm>=1.28",
    "onnxruntime<1.24; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/tanlnm512/cairn"

[tool.setuptools]
py-modules = ["cairn_intel_ingest"]
