[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cairn-intel"
version = "0.23.1"
description = "Local codebase intelligence system: structural graph + compass + wiki + agent memory (deprecated: install the standalone cairn binary instead; see README)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Tan Le"},
]
keywords = ["code-intelligence", "tree-sitter", "mcp", "knowledge-graph", "code-graph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
]
# The package is the console-script launcher for the bundled engine binary plus
# the sidecars below; the launcher itself needs nothing beyond the stdlib.
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]
dev = [
    "pytest>=7.0",
    # The communities sidecar tests exercise the lazy [graph-analytics] import.
    "networkx>=3.4",
    # scripts/run_skill_evals.py parses the eval frontmatter.
    "pyyaml>=6.0",
    "build",
    "ruff>=0.6",
    # Review/audit pipeline (Layer 1 CI gates). Run locally before pushing:
    #   mypy --ignore-missing-imports src
    #   bandit -r src -ii -ll -s B608
    #   pip-audit
    # Pinned (not >=) so local and CI run the SAME mypy.
    "mypy==2.3.0",
    "bandit>=1.7",
    "pip-audit>=2.7",
    # Local review/audit gate (Layer 0 of the review pipeline): defines the
    # pre-commit hooks (.pre-commit-config.yaml) that run before every commit.
    "pre-commit>=4.0",
    # Release tooling: `cz bump` bumps the version across version_files and
    # tags the release; CHANGELOG.md stays hand-maintained. See
    # docs/release-checklist.md "Cutting a release".
    "commitizen>=4.0",
]

# Binary-document conversion sidecar (cairn.ingest_convert): pymupdf4llm for
# PDF, mammoth + markdownify for docx (mammoth's own Markdown writer is
# deprecated; the composition goes HTML -> markdown). Imports are strictly
# lazy, so base installs import the module cleanly.
ingest = [
    "pymupdf4llm>=1.28",
    "mammoth>=1.11",
    "markdownify>=0.13",
    "onnxruntime<1.24; python_version < '3.11'",
]

# Symbol-community analytics sidecar (`cairn communities`, cairn.communities):
# Louvain partitioning via networkx. Opt-in because the engine never needs it;
# the import is lazy and absence fails with an actionable install hint. Floor
# 3.4 keeps `louvain_communities(seed=...)` available on every supported arm.
graph-analytics = [
    "networkx>=3.4",
]

[project.scripts]
cairn = "cairn.console:main"

[project.urls]
Homepage = "https://github.com/tanlnm512/cairn"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Injected engine binary: release/wheel builds copy the platform binary into
# src/cairn/_bin/ immediately before packaging; the tree never commits it
# (gitignored) and MANIFEST.in keeps it out of the sdist.
"cairn" = ["_bin/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_env: opts a test out of the suite-wide _hermetic_env fixture (justify in a comment)",
    # The infra tier is CI selection, NOT a quarantine: every marked test still
    # runs and must pass on each main push (ci.yml's main-only `-m infra` step);
    # per-PR legs exclude it via an explicit `-m "not infra"`.
    "infra: oracle-replay tests that need the release rust binary -- excluded from per-PR legs (pytest -m \"not infra\"), run on every main push (pytest -m infra)",
]

[tool.ruff]
# Conservative gate: pyflakes (F) only. Catches real defects (undefined names,
# unused imports, redefinitions) with a low false-positive rate. Style rules
# (E, UP, BLE, S, etc.) are intentionally excluded -- the codebase predates
# ruff and adopting them would be a dedicated cleanup PR, not a CI gate.
src = ["src", "scripts", "tests"]
# Golden fixtures are test *input* data (deliberately-shaped source the parser
# exercises), not test code -- linting them would rewrite the fixtures and
# invalidate the very golden tests that consume them.
extend-exclude = [
  "tests/fixtures",
]

[tool.ruff.lint]
select = ["F"]

[tool.commitizen]
# Release automation (see docs/release-checklist.md).
#
# `cz bump` does the mechanical parts of a release:
#   1. reads conventional commits since the last tag
#   2. computes the next SemVer bump (feat -> MINOR, fix -> PATCH, etc.)
#   3. updates `version` here AND `__version__` in src/cairn/__init__.py
#   4. commits ("bump: version X -> Y") and tags (v$version)
#
# update_changelog_on_bump is FALSE on purpose: commitizen's changelog
# generator derives terse one-line entries from commit subjects, which would
# replace the rich, hand-curated multi-paragraph entries this project keeps
# (e.g. the 0.6.1 release notes). Instead CHANGELOG.md stays hand-maintained,
# and `cz bump --dry-run --changelog-to-stdout` is used as a *drafting* aid --
# it prints the commit-derived section for review, which can then be expanded
# into the project's prose style under [Unreleased] -> [X.Y.Z].
#
# The custom template (.cz_templates/keepachangelog.j2) renders that draft in
# the existing `## [X.Y.Z] - YYYY-MM-DD` format rather than commitizen's
# default `## X.Y.Z (YYYY-MM-DD)`.
version = "0.23.1"
version_scheme = "pep440"
tag_format = "v$version"
update_changelog_on_bump = false
changelog_file = "CHANGELOG.md"
template = ".cz_templates/keepachangelog.j2"
version_files = [
    "pyproject.toml:version",
    "src/cairn/__init__.py:__version__",
]
