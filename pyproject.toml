[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "cairn-intel"
version = "0.24.1"
description = "Local codebase intelligence system: structural graph + compass + wiki + agent memory"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Tan Le"},
]
keywords = ["code-intelligence", "tree-sitter", "mcp", "knowledge-graph", "code-graph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
]
# The wheel is the engine binary: nothing Python-side at runtime.
dependencies = []

[project.optional-dependencies]
dev = [
    # PEP 517 front end the wheel smoke drives, as a pip user's build would.
    "build",
]

[project.urls]
Homepage = "https://github.com/tanlnm512/cairn"

# The wheel is the cairn-cli binary installed as the `cairn` executable
# (py3-none-<platform>); the sdist carries the cargo workspace. The vendored
# sqlite-vec is reached through [patch.crates-io], which maturin's sdist
# walker does not follow, so it is included explicitly.
[tool.maturin]
bindings = "bin"
manifest-path = "rust/crates/cairn-cli/Cargo.toml"
include = [
    { path = "LICENSE", format = "sdist" },
    { path = "NOTICE", format = "sdist" },
    { path = "rust/vendor/sqlite-vec/**/*", format = "sdist" },
]

# Installing the project means compiling the engine, so uv manages only the
# dev environment.
[tool.uv]
package = false
