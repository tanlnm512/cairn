[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cairn-intel"
version = "0.9.1"
description = "Local codebase intelligence system: structural graph + compass + wiki + agent memory"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Tan Le"},
]
keywords = ["code-intelligence", "tree-sitter", "mcp", "knowledge-graph", "code-graph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "tree-sitter==0.26.0",
    "tree-sitter-kotlin==1.1.0",
    "tree-sitter-java==0.23.5",
    "tree-sitter-python==0.23.6",
    "tree-sitter-swift==0.7.3",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-javascript==0.23.0",
    "tree-sitter-dart==0.1.0",
    "tree-sitter-objc==3.0.2",
    "tree-sitter-go==0.25.0",
    "tree-sitter-php==0.24.1",
    "tree-sitter-ruby==0.23.1",
    "tree-sitter-c-sharp==0.23.1",
    "tree-sitter-c==0.23.4",
    "tree-sitter-cpp==0.23.4",
    "click>=8.0",
    "pyyaml>=6.0",
    "mcp>=0.9.0,<2.0.0",  # SSE/streamable-http + uvicorn/starlette are core deps in mcp>=0.9; the legacy [sse] extra was removed upstream
    "pydantic>=2.0",  # used directly by mcp_server/structured.py; declared explicitly (not just transitive via mcp)
    "pathspec>=0.12",
    "packaging>=21.0",  # PEP 440 version comparison in `cairn upgrade`; declared explicitly (transitively always present via pip/setuptools, but the CLI relies on it)
    "sqlite-vec>=0.1.0",
    # Progress display: spinners, progress bars, ETA/rate, themed tables.
    # Pure-Python, no network/torch -- keeps the default install lightweight.
    "rich>=13.0",
    "questionary>=2.0",
]

[project.optional-dependencies]
watch = ["watchdog>=3.0"]
test = ["pytest>=7.0"]
dev = [
    "pytest>=7.0",
    # Coverage reporting in CI (Layer 1 test job). Reporting-only, no threshold.
    "pytest-cov>=4.0",
    "watchdog>=3.0",
    "build",
    "ruff>=0.6",
    # Review/audit pipeline (Layer 1 CI gates). Run locally before pushing:
    #   mypy --ignore-missing-imports src
    #   bandit -r src -ii -ll -s B608   # -s B608: every query is parameterized,
    #                                   # so B608 is endemic-but-safe noise
    #   pip-audit
    # Pinned (not >=) so local and CI run the SAME mypy -- a floating mypy
    # caused CI-only version drift. ~58 known errors (advisory: continue-on-error
    # in CI; drive the count down, then remove continue-on-error to promote it).
    "mypy==2.3.0",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "grpcio-tools>=1.60",
    # Local review/audit gate (Layer 0 of the review pipeline): defines the
    # pre-commit hooks (.pre-commit-config.yaml) that run before every commit.
    "pre-commit>=4.0",
    # Release tooling: `cz bump` bumps the version across version_files and
    # tags the release; CHANGELOG.md stays hand-maintained. See
    # docs/release-checklist.md "Cutting a release".
    "commitizen>=4.0",
]
# Phase 7: semantic search. Pulls torch (~hundreds of MB) via
# sentence-transformers, hence strictly optional. The default install remains
# zero-network and torch-free; `pip install cairn-intel[semantic]` opts in.
# numpy accelerates the cosine scan at scale (>10k embeddings); without it the
# scan falls back to pure Python (correct, but slow on large corpora).
# Phase 7b: this same dependency also provides CrossEncoder, so the optional
# rerank stage (CAIRN_RERANK=1, see src/graph/reranker.py) needs no
# separate extra -- installing [semantic] is enough for both embeddings and
# reranking.
semantic = [
    "sentence-transformers>=3.0",
    "numpy>=1.24",
]
# Phase 7c: native ANN index for semantic_search (CAIRN_ANN_BACKEND=
# sqlite-vec, see src/graph/ann_index.py). Separate from [semantic] since it
# only matters at real corpus scale -- the brute-force cosine scan is the
# default and remains fine for small/medium repos. A small, self-contained
# loadable SQLite extension (no torch, no native build step on supported
# platforms), so this stays cheap even for users who don't want [semantic].
ann = [
    "sqlite-vec>=0.1.0",
]
# SCIP (Sourcegraph Code Intelligence Protocol) consumption. No PyPI package
# ships Sourcegraph's SCIP protobuf bindings -- the `scip` name on PyPI is an
# unrelated bioimaging library, and Sourcegraph ships no official Python
# bindings (sourcegraph/scip#259, open/unresolved). The real dependency is the
# generic `protobuf` runtime, paired with a checked-in generated stub
# (src/cairn/parsers/_scip_pb2.py) -- the same approach googleapis-common-protos
# uses to avoid requiring protoc/grpcio-tools at install time. Regenerating the
# stub is a dev-only step (`scripts/regen_scip_pb2.sh`), never a runtime need.
scip = [
    "protobuf>=7.35.1",
]
# Optional OTLP export (task T19, observability-telemetry spec §3 + §7):
# setting CAIRN_OTEL_ENDPOINT exports cairn's LOCAL telemetry events as
# OpenTelemetry LogRecords to that OTLP/http endpoint. Strictly lazy -- the
# SDK is imported only inside the exporter's first flush, after the env gate,
# so the default install stays OTel-free and cairn works fine without this
# extra (one warn_once, then local-only). OTel is never a required install.
otlp = [
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]

[project.scripts]
cairn = "cairn.cli:main"

[project.urls]
Homepage = "https://github.com/tanlnm512/cairn"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the agent-integration templates (SKILL.md, commands, cursor rules, etc.)
# so `cairn install-agents` works from a wheel install, not just a source checkout.
"cairn.agent_integration" = ["**/*"]

[tool.pytest.ini_options]
# `core` marks the fast smoke subset (tests/test_core_smoke.py): one focused
# test per core function across all 5 layers, runnable via `pytest -m core` for
# a <3s feedback loop. The full suite (no marker) remains the CI path.
markers = [
    "core: high-signal smoke tests covering the core query/build/transport path (run with -m core)",
]

[tool.ruff]
# Conservative gate: pyflakes (F) only. Catches real defects (undefined names,
# unused imports, redefinitions) with a low false-positive rate. Style rules
# (E, UP, BLE, S, etc.) are intentionally excluded -- the codebase predates
# ruff and adopting them would be a dedicated cleanup PR, not a CI gate.
src = ["src", "scripts", "tests"]
# Golden fixtures are test *input* data (deliberately-shaped source the parser
# exercises), not test code -- linting them would rewrite the fixtures and
# invalidate the very golden tests that consume them.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["F"]

[tool.commitizen]
# Release automation (see docs/release-checklist.md).
#
# `cz bump` does the mechanical parts of a release:
#   1. reads conventional commits since the last tag
#   2. computes the next SemVer bump (feat -> MINOR, fix -> PATCH, etc.)
#   3. updates `version` here AND `__version__` in src/cairn/__init__.py
#   4. commits ("bump: version X -> Y") and tags (v$version)
#
# update_changelog_on_bump is FALSE on purpose: commitizen's changelog
# generator derives terse one-line entries from commit subjects, which would
# replace the rich, hand-curated multi-paragraph entries this project keeps
# (e.g. the 0.6.1 release notes). Instead CHANGELOG.md stays hand-maintained,
# and `cz bump --dry-run --changelog-to-stdout` is used as a *drafting* aid --
# it prints the commit-derived section for review, which can then be expanded
# into the project's prose style under [Unreleased] -> [X.Y.Z].
#
# The custom template (.cz_templates/keepachangelog.j2) renders that draft in
# the existing `## [X.Y.Z] - YYYY-MM-DD` format rather than commitizen's
# default `## X.Y.Z (YYYY-MM-DD)`.
version = "0.9.1"
version_scheme = "pep440"
tag_format = "v$version"
update_changelog_on_bump = false
changelog_file = "CHANGELOG.md"
template = ".cz_templates/keepachangelog.j2"
version_files = [
    "pyproject.toml:version",
    "src/cairn/__init__.py:__version__",
]
